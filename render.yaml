services:
  - type: web
    name: aeroyield-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: AeroYield
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: 'false'
      - key: DATABASE_URL
        value: sqlite:///./aeroyield.db
      - key: API_KEYS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_PATH
        value: ./crop_vital_model.pkl
      - key: MODEL_VERSION
        value: '1.0'
      - key: MODEL_METADATA_PATH
        value: ./crop_vital_model_metadata.json
      - key: AUDIO_CACHE_DIR
        value: ./audio_cache
